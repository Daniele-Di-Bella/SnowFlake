<!DOCTYPE html>
<html lang="it" class="dark h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>❄️ SnowFlake</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              bg: '#0d1117',
              card: '#161b22',
              border: '#30363d',
              accent: '#10b981',
              muted: '#8b949e',
              text: '#c9d1d9'
            }
          },
          fontFamily: {
            mono: ['JetBrains Mono', 'Fira Code', 'Consolas', 'monospace'],
            sans: ['-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif']
          }
        }
      }
    }
  </script>

  <!-- Vue 3 CDN -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

  <!-- Firebase SDK Modules via CDN -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { 
      getAuth, 
      signInWithEmailAndPassword, 
      signOut, 
      onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    window.FirebaseInit = {
      initializeApp,
      getAuth,
      signInWithEmailAndPassword,
      signOut,
      onAuthStateChanged,
      getFirestore,
      doc,
      setDoc,
      onSnapshot
    };
  </script>

  <style>
    body {
      background-color: #0d1117;
      color: #c9d1d9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    input, select, button {
      font-size: 14px !important;
    }
    .touch-target {
      min-height: 42px;
      min-width: 42px;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    select option {
      background-color: #161b22 !important;
      color: #ffffff !important;
      padding: 8px;
    }
  </style>
</head>
<body class="h-full bg-[#0d1117] text-[#c9d1d9] antialiased selection:bg-emerald-500/30">

<div id="app" class="min-h-screen flex flex-col max-w-5xl mx-auto px-3 sm:px-6 pb-12 font-mono overflow-x-hidden">

    <!-- SCHERMATA DI LOGIN (Mostrata solo se non autenticati) -->
    <div v-if="!isAuthenticated" class="min-h-screen flex items-center justify-center p-4">
      <div class="bg-[#161b22] border border-[#30363d] p-6 sm:p-8 rounded-xl max-w-md w-full shadow-2xl space-y-4">
        <div class="text-center space-y-1">
          <span class="text-4xl">❄️</span>
          <h2 class="text-xl font-bold text-white">Accesso Riservato</h2>
          <p class="text-xs text-[#8b949e]">Inserisci le tue credenziali UniVE o ISP e la password per accedere a SnowFlake</p>
        </div>

        <form @submit.prevent="login" class="space-y-3">
          <div>
            <label class="block text-[11px] text-[#8b949e] mb-1">EMAIL</label>
            <input 
              v-model="loginEmail" 
              type="email" 
              required 
              placeholder="nome.cognome@unive/cnr.it" 
              class="w-full bg-[#0d1117] border border-[#30363d] rounded-lg px-3 py-2 text-xs text-white focus:border-emerald-500 outline-none"
            >
          </div>
          <div>
            <label class="block text-[11px] text-[#8b949e] mb-1">PASSWORD</label>
            <input 
              v-model="loginPassword" 
              type="password" 
              required 
              placeholder="••••••••" 
              class="w-full bg-[#0d1117] border border-[#30363d] rounded-lg px-3 py-2 text-xs text-white focus:border-emerald-500 outline-none"
            >
          </div>

          <div v-if="authError" class="text-xs text-red-400 bg-red-950/40 border border-red-800 p-2 rounded">
            {{ authError }}
          </div>

          <button 
            type="submit" 
            :disabled="isLoggingIn" 
            class="w-full bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold py-2.5 rounded-lg transition disabled:opacity-50"
          >
            {{ isLoggingIn ? 'Autenticazione in corso...' : 'Accedi al Sito' }}
          </button>
        </form>
      </div>
    </div>

    <!-- HEADER -->
    <template v-else>
      <header class="py-4 border-b border-[#30363d] flex items-center justify-between gap-2 shrink-0">
        <div class="flex items-center gap-2 min-w-0 pr-1">
          <span class="text-xl sm:text-2xl shrink-0">❄️</span>
          <div class="min-w-0">
            <div class="flex items-center gap-2">
              <h1 class="text-base sm:text-lg font-bold text-white tracking-tight truncate">SnowFlake</h1>
              <!-- Realtime Sync Badge Indicator -->
              <span 
                :class="[
                  'text-[9px] font-bold px-2 py-0.5 rounded-full border flex items-center gap-1 transition-all',
                  syncStatus === 'live' ? 'bg-emerald-950 text-emerald-300 border-emerald-700' : 'bg-amber-950 text-amber-300 border-amber-700'
                ]"
                :title="syncStatus === 'live' ? 'Sincronizzazione cloud istantanea attiva per PC e smartphone' : 'Modalità memoria locale'"
              >
                <span class="w-1.5 h-1.5 rounded-full" :class="syncStatus === 'live' ? 'bg-emerald-400 animate-pulse' : 'bg-amber-400'"></span>
                <span>{{ syncStatus === 'live' ? 'LIVE SYNC' : 'LOCAL' }}</span>
              </span>
            </div>
            <p class="text-[10px] sm:text-xs text-[#8b949e] truncate">Gestionale Gruppo Ice Memory</p>
          </div>
        </div>

        <!-- Active User Identity Selector & Lock Controls -->
        <div class="flex items-center gap-1.5 sm:gap-2 shrink-0 ml-auto justify-end">
          <div class="relative">
            <button 
              @click="isIdentityDropdownOpen = !isIdentityDropdownOpen"
              :disabled="isIdentityLocked"
              :class="[
                'bg-[#161b22] text-white border text-xs rounded-lg px-2 sm:px-3 py-2 outline-none flex items-center gap-1.5 sm:gap-2 transition shadow-sm touch-target',
                isIdentityLocked ? 'border-emerald-500/80 bg-emerald-950/30 text-emerald-300 font-bold opacity-100 cursor-not-allowed' : 'border-[#30363d] hover:border-emerald-500 cursor-pointer'
              ]"
              :title="isIdentityLocked ? 'Identità Bloccata (Sblocca per cambiare utente)' : 'Cambia Utente Attivo'"
            >
              <span class="text-base leading-none">{{ currentUser.emoji }}</span>
              <div class="hidden sm:block text-left">
                <div class="font-bold leading-tight">{{ currentUser.name }}</div>
              </div>
              <span v-if="!isIdentityLocked" class="text-[10px] text-[#8b949e] transition-transform duration-200" :class="{ 'rotate-180': isIdentityDropdownOpen }">▼</span>
            </button>

            <!-- Custom Dropdown Menu -->
            <div 
              v-if="isIdentityDropdownOpen && !isIdentityLocked" 
              class="absolute right-0 mt-1.5 w-56 sm:w-60 bg-[#161b22] border border-[#30363d] rounded-xl shadow-2xl py-1.5 z-50 text-xs overflow-hidden max-w-[85vw]"
            >
              <div class="px-3 py-1.5 text-[10px] font-bold text-[#8b949e] uppercase tracking-wider border-b border-[#30363d]">
                Seleziona Utente Attivo
              </div>
              <button 
                v-for="u in users" 
                :key="u.id" 
                @click="selectUser(u)" 
                :class="[
                  'w-full px-3 py-2.5 text-left flex items-center justify-between transition hover:bg-[#21262d]',
                  u.id === currentUser.id ? 'bg-[#21262d] text-emerald-400 font-bold' : 'text-white'
                ]"
              >
                <div class="flex items-center gap-2 min-w-0">
                  <span class="text-sm shrink-0">{{ u.emoji }}</span>
                  <div class="truncate">
                    <div class="text-xs">{{ u.name }}</div>
                  </div>
                </div>
                <span v-if="u.id === currentUser.id" class="text-xs shrink-0">✓</span>
              </button>
            </div>
            
            <!-- Backdrop -->
            <div v-if="isIdentityDropdownOpen" @click="isIdentityDropdownOpen = false" class="fixed inset-0 z-40"></div>
          </div>

          <!-- Lock Toggle Button -->
          <button 
            @click="toggleIdentityLock"
            :class="[
              'px-2.5 sm:px-3 py-2 text-xs font-bold rounded-lg transition shrink-0 flex items-center gap-1.5 touch-target shadow-sm',
              isIdentityLocked 
                ? 'bg-emerald-900/80 hover:bg-emerald-800 text-emerald-200 border border-emerald-600' 
                : 'bg-amber-600 hover:bg-amber-500 text-white border border-amber-400 animate-pulse'
            ]"
            :title="isIdentityLocked ? 'Identità Bloccata - Azioni Abilitate' : 'Identità Sbloccata - Azioni Disabilitate'"
          >
            <span class="text-sm">{{ isIdentityLocked ? '🔒' : '🔓' }}</span>
            <span class="hidden xs:inline sm:inline text-[11px]">
              {{ isIdentityLocked ? 'Bloccato' : 'Sbloccato' }}
            </span>
          </button>
        </div>
      </header>

    <!-- UNLOCKED IDENTITY WARNING BANNER -->
    <div v-if="!isIdentityLocked" class="mt-3 bg-amber-950/60 border border-amber-700/80 text-amber-200 px-3.5 py-2.5 rounded-xl text-xs flex items-center justify-between gap-3 shadow-sm">
      <div class="flex items-center gap-2 min-w-0">
        <span class="text-base shrink-0">⚠️</span>
        <p class="whitespace-normal">
          <strong>Identità non bloccata!</strong> Per eseguire o gestire qualsiasi azione seleziona l'utente e clicca sul lucchetto in alto a destra.
        </p>
      </div>
    </div>

    <!-- NAVIGATION TABS -->
    <nav class="flex overflow-x-auto no-scrollbar gap-2 py-3 border-b border-[#30363d] shrink-0 text-xs">
      <button 
        @click="activeTab = 'overview'"
        :class="[
          'px-3.5 py-2 rounded-lg border transition-all whitespace-nowrap shrink-0 flex items-center gap-2 touch-target font-semibold',
          activeTab === 'overview' 
            ? 'bg-[#21262d] text-white border-emerald-500 shadow-sm' 
            : 'bg-[#161b22] text-[#8b949e] border-[#30363d] hover:text-white'
        ]"
      >
        <span>📋</span>
        <span>PANORAMICA</span>
        <span class="ml-1 text-[10px] px-1.5 py-0.2 rounded-full bg-emerald-950 text-emerald-400 border border-emerald-800/80 font-mono">
          {{ globalAnalysisProgress.percent }}%
        </span>
      </button>

      <div class="w-px h-6 bg-[#30363d] mx-1 self-center shrink-0"></div>

      <button 
        v-for="topic in topics" 
        :key="topic.id"
        @click="activeTab = topic.id"
        :class="[
          'px-3.5 py-2 rounded-lg border transition-all whitespace-nowrap shrink-0 flex items-center gap-2 touch-target font-semibold',
          activeTab === topic.id 
            ? 'bg-[#21262d] text-white border-emerald-500 shadow-sm' 
            : 'bg-[#161b22] text-[#8b949e] border-[#30363d] hover:text-white'
        ]"
      >
        <span>{{ topic.icon }}</span>
        <span>{{ topic.name }}</span>
        <span class="ml-0.5 text-[10px] px-1.5 py-0.2 rounded-full bg-[#0d1117] text-[#8b949e] border border-[#30363d] font-mono">
          {{ getTopicAnalysisProgress(topic.id).percent }}%
        </span>
      </button>
    </nav>

    <!-- MAIN CONTENT CONTAINER -->
    <main class="flex-1 py-4 space-y-6">

      <!-- OVERVIEW TAB (Lab Chief Dashboard) -->
      <section v-if="activeTab === 'overview'" class="space-y-5">
        
        <!-- Stats Widgets Grid -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
          <div class="bg-[#161b22] border border-[#30363d] rounded-xl p-4 shadow-sm flex justify-between items-center">
            <div>
              <div class="text-[10px] font-bold text-[#8b949e] uppercase tracking-wider mb-1">Acquisti In Attesa</div>
              <div class="text-2xl font-bold text-white">{{ pendingPurchases.length }}</div>
            </div>
            <span class="text-2xl opacity-50">💳</span>
          </div>
          <div class="bg-[#161b22] border border-[#30363d] rounded-xl p-4 shadow-sm flex justify-between items-center">
            <div>
              <div class="text-[10px] font-bold text-[#8b949e] uppercase tracking-wider mb-1">Documenti In Attesa</div>
              <div class="text-2xl font-bold text-white">{{ pendingBureaucracy.length }}</div>
            </div>
            <span class="text-2xl opacity-50">📄</span>
          </div>
          <div class="bg-[#161b22] border border-[#30363d] rounded-xl p-4 shadow-sm flex justify-between items-center">
            <div>
              <div class="text-[10px] font-bold text-[#8b949e] uppercase tracking-wider mb-1">Scadenze Imminenti (7gg)</div>
              <div class="text-2xl font-bold text-emerald-400">{{ upcomingDeadlines.length }}</div>
            </div>
            <span class="text-2xl opacity-50">📅</span>
          </div>
        </div>

        <!-- Chief Role Status Banner -->
        <div v-if="currentUser.role !== 'chief'" class="bg-amber-950/30 border border-amber-800/50 text-amber-300 p-3.5 rounded-xl text-xs flex items-start gap-2.5">
          <span class="text-base shrink-0">⚠️</span>
          <p class="leading-relaxed">
            Stai visualizzando la panoramica generale. Solamente i <strong>3 Capi Lab</strong> (Dr. Head, Dr. Chief 2, Dr. Chief 3) hanno i permessi necessari per risolvere le richieste.
          </p>
        </div>

        <!-- Pending Needs List (Grouped Dashboard) -->
        <div class="bg-[#161b22] border border-[#30363d] rounded-xl overflow-hidden shadow-sm">
          <div class="px-4 py-3 border-b border-[#30363d] flex items-center justify-between bg-[#0d1117]">
            <h2 class="text-xs sm:text-sm font-bold text-white flex items-center gap-2">
              <span>📥</span> Richieste in Attesa di Risoluzione
            </h2>
            <span class="text-[10px] text-emerald-400 bg-emerald-950/80 px-2 py-0.5 rounded border border-emerald-800 font-bold">LIVE STATUS</span>
          </div>

          <div v-if="pendingNeeds.length === 0" class="p-8 text-center text-[#8b949e] text-xs">
            <div class="text-3xl mb-2">✅</div>
            <p>Tutto aggiornato! Nessuna richiesta attesa dal gruppo.</p>
          </div>

          <div v-else class="divide-y divide-[#30363d]">
            <div v-for="need in pendingNeeds" :key="need.id" class="p-3.5 sm:p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3 hover:bg-[#21262d]/50 transition">
              <div class="flex-1 min-w-0">
                <div class="flex items-center gap-2 mb-1">
                  <span :class="[
                    'text-[9px] font-bold px-2 py-0.5 rounded uppercase tracking-wide border',
                    need.type === 'purchase' ? 'bg-indigo-950 text-indigo-300 border-indigo-800' : 'bg-amber-950 text-amber-300 border-amber-800'
                  ]">
                    {{ need.type === 'purchase' ? '💳 Acquisto' : '📄 Documenti' }}
                  </span>
                  <span class="text-[10px] text-[#8b949e] bg-[#0d1117] px-2 py-0.5 rounded border border-[#30363d]">
                    {{ getTopicName(need.topicId) }}
                  </span>
                </div>
                <h3 class="text-xs sm:text-sm font-bold text-white mb-0.5">{{ need.title }}</h3>
                <div class="text-[11px] sm:text-xs text-[#8b949e] flex flex-wrap items-center gap-x-3 gap-y-1">
                  <span>Richiesto da: <strong class="text-white">{{ getUserName(need.createdBy) }}</strong></span>
                  <span v-if="need.details" class="truncate max-w-[250px] sm:max-w-md">• {{ need.details }}</span>
                </div>
              </div>

              <!-- Action Button for Chiefs Only -->
              <div class="shrink-0 flex items-center">
                <button 
                  v-if="currentUser.role === 'chief'"
                  @click="resolveNeed(need.id)"
                  :disabled="!isIdentityLocked"
                  :class="[
                    'w-full sm:w-auto px-3 py-2 sm:py-1.5 rounded-lg text-xs font-bold transition flex items-center justify-center gap-1.5 touch-target border',
                    isIdentityLocked 
                      ? 'bg-emerald-950 hover:bg-emerald-900 text-emerald-300 border-emerald-700 cursor-pointer' 
                      : 'bg-gray-800 text-gray-500 border-gray-700 cursor-not-allowed opacity-60'
                  ]"
                >
                  <span>{{ isIdentityLocked ? '✓' : '🔒' }}</span>
                  <span>Risolvi</span>
                </button>
                <div v-else class="text-[11px] text-[#8b949e] italic">
                  Riservato ai Capi Lab
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- SECTION ANALYSES PROGRESS TRACKER CARD -->
        <div class="bg-[#161b22] border border-[#30363d] rounded-xl p-4 sm:p-5 shadow-sm space-y-4">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 border-b border-[#30363d] pb-3">
            <div>
              <h2 class="text-xs sm:text-sm font-bold text-white flex items-center gap-2">
                <span>📊</span> Avanzamento Delle Analisi
              </h2>
              <p class="text-[11px] text-[#8b949e]">Tracciamento delle analisi di laboratorio condotte in ciascun gruppo</p>
            </div>
            <div class="text-xs font-mono font-bold text-emerald-400 bg-emerald-950/60 px-2.5 py-1 rounded border border-emerald-800 shrink-0 self-start sm:self-auto">
              Totale: {{ globalAnalysisProgress.completed }} / {{ globalAnalysisProgress.total }} Completate ({{ globalAnalysisProgress.percent }}%)
            </div>
          </div>

          <!-- Grid of Topic Analysis Progresses -->
          <div class="grid grid-cols-1 md:grid-cols-2 gap-3.5">
            <div 
              v-for="topic in topics" 
              :key="'ov-prog-'+topic.id" 
              @click="activeTab = topic.id"
              class="bg-[#0d1117] border border-[#30363d] hover:border-emerald-500/50 rounded-lg p-3.5 transition cursor-pointer space-y-2.5 group"
            >
              <div class="flex items-center justify-between text-xs">
                <span class="font-bold text-white group-hover:text-emerald-400 transition flex items-center gap-1.5">
                  <span>{{ topic.icon }}</span> {{ topic.name }}
                </span>
                <span class="font-mono text-emerald-400 font-bold text-[11px]">
                  {{ getTopicAnalysisProgress(topic.id).completed }} / {{ getTopicAnalysisProgress(topic.id).total }} Completate ({{ getTopicAnalysisProgress(topic.id).percent }}%)
                </span>
              </div>

              <!-- Progress Bar -->
              <div class="w-full bg-[#161b22] rounded-full h-2 overflow-hidden border border-[#30363d] p-0.5">
                <div 
                  class="bg-gradient-to-r from-emerald-600 to-emerald-400 h-full rounded-full transition-all duration-500" 
                  :style="{ width: getTopicAnalysisProgress(topic.id).percent + '%' }"
                ></div>
              </div>

              <div class="flex justify-between items-center text-[10px] text-[#8b949e] pt-0.5">
                <span>Referenti: {{ topic.refs.map(r => getUserName(r)).join(', ') }}</span>
                <span class="text-emerald-400 font-semibold group-hover:underline">Vai alla pagina →</span>
              </div>
            </div>
          </div>
        </div>

      </section>

      <!-- TOPIC TABS -->
      <section v-for="topic in topics" :key="'sec-'+topic.id" v-show="activeTab === topic.id" class="space-y-4">
        
        <!-- Topic Header Banner -->
        <div class="bg-[#161b22] border border-[#30363d] rounded-xl p-4 sm:p-5 flex flex-col sm:flex-row sm:items-center justify-between gap-3 shadow-sm">
          <div>
            <h2 class="text-base sm:text-lg font-bold text-white flex items-center gap-2">
              <span>{{ topic.icon }}</span> {{ topic.name }}
            </h2>
            <p class="text-xs text-[#8b949e] mt-0.5">Pagina Operativa</p>
          </div>
          <div class="flex items-center gap-2">
            <span class="text-xs text-[#8b949e] shrink-0">Referenti:</span>
            <div class="flex flex-wrap gap-1">
              <div v-for="refId in topic.refs" :key="refId" class="flex items-center gap-1 bg-[#0d1117] border border-[#30363d] px-2 py-0.5 rounded text-xs text-white">
                  <span>{{ getUserEmoji(refId) }}</span>
                  <span>{{ getUserName(refId) }}</span>
              </div>
            </div>
          </div>
        </div>

        <!-- PAGE PROGRESS TRACKER BAR FOR THIS TOPIC -->
        <div class="bg-[#161b22] border border-[#30363d] rounded-xl p-3.5 sm:p-4 shadow-sm space-y-2">
          <div class="flex items-center justify-between text-xs">
            <div class="flex items-center gap-2 font-bold text-white">
              <span>⏯️</span>
              <span>Avanzamento Attività - {{ topic.name }}</span>
            </div>
          </div>
          
          <!-- Topic Progress Bar -->
          <div class="w-full bg-[#0d1117] rounded-full h-2.5 overflow-hidden border border-[#30363d] p-0.5">
            <div 
              class="bg-gradient-to-r from-emerald-600 to-emerald-400 h-full rounded-full transition-all duration-500" 
              :style="{ width: getTopicAnalysisProgress(topic.id).percent + '%' }"
            ></div>
          </div>

          <div class="flex justify-between items-center text-[10px] text-[#8b949e]">
            <span>Completamento analisi programmate per questo tema o campione</span>
            <span>Analisi In Corso: {{ getAnalysesByTopic(topic.id).length - getTopicAnalysisProgress(topic.id).completed }}</span>
          </div>
        </div>

        <!-- Access Control Alert -->
        <div v-if="!canManageTopic(topic)" class="bg-[#161b22] border border-[#30363d] text-[#8b949e] p-3 rounded-xl text-xs flex items-center gap-2">
          <span>🔒</span>
          <span>Modalità Sola Lettura: Puoi aggiungere o modificare le attività di questa sezione solo se sei assegnato come <strong>Referente</strong> di questa materia o come <strong>Capo Lab</strong>.</span>
        </div>

        <!-- ANALYSES TO CONDUCT -->
        <div class="bg-[#161b22] border border-[#30363d] rounded-xl overflow-hidden shadow-sm flex flex-col">
          <div class="px-4 py-3 border-b border-[#30363d] bg-[#0d1117] flex items-center justify-between">
            <h3 class="text-xs font-bold text-white flex items-center gap-2">
              <span>🧬</span> ANALISI/ESPERIMENTI
            </h3>
            <span class="text-[10px] text-[#8b949e] font-mono">
              {{ getTopicAnalysisProgress(topic.id).completed }} di {{ getAnalysesByTopic(topic.id).length }} Completate
            </span>
          </div>

          <!-- Add Analysis Form -->
          <div v-if="canManageTopic(topic)" class="p-3 border-b border-[#30363d] bg-[#0d1117]/50 space-y-2">
            <div class="flex items-center justify-between">
              <span class="text-[10px] font-bold text-emerald-400 uppercase tracking-wide">REGISTRA NUOVA ANALISI</span>
            </div>

            <div class="flex flex-col sm:flex-row gap-2">
              <input 
                v-model="newAnalysis.title" 
                type="text" 
                :disabled="!isIdentityLocked"
                placeholder="Titolo dell'analisi/esperimento"

<script>
  const { createApp, ref, computed, onMounted, watch } = Vue;

  createApp({
    setup() {
      // --- 1. USERS & ROLES DATA ---
      const users = [
        { id: 'u1', name: 'Jacopo', role: 'chief', emoji: '🐥' },
        { id: 'u2', name: 'Andrea', role: 'chief', emoji: '🍺' },
        { id: 'u3', name: 'Fabrizio', role: 'chief', emoji: '🐴' },
        { id: 'u4', name: 'DanieleZ', role: 'ref', emoji: '🛠️' },
        { id: 'u5', name: 'Azzurra', role: 'ref', emoji: '💎' },
        { id: 'u6', name: 'Federico', role: 'ref', emoji: '🌋' },
        { id: 'u7', name: 'Agnese', role: 'ref', emoji: '🐦‍⬛' },
        { id: 'u8', name: 'Giulia', role: 'ref', emoji: '🐋' },
        { id: 'u9', name: 'Enrico', role: 'ref', emoji: '🧛‍♂️' },
        { id: 'u10', name: 'Cecilia', role: 'ref', emoji: '😈' },
        { id: 'u11', name: 'Daniele', role: 'ref', emoji: '🐒' },
        { id: 'u12', name: 'Margherita', role: 'ref', emoji: '🦩' }
      ];

      const topics = [
        { id: 't1', name: 'COLLE DEL LYS', icon: '🧊', refs: ['u7', 'u10'] },
        { id: 't2', name: 'GRAND COMBIN', icon: '🧊', refs: ['u8'] },
        { id: 't3', name: 'HOLTEDAHLFONNA', icon: '🧊', refs: ['u9', 'u12'] },
        { id: 't4', name: 'CFA', icon: '💧', refs: ['u5'] },
        { id: 't6', name: 'MICROBIOLOGIA', icon: '🦠', refs: ['u11', 'u12'] },
        { id: 't7', name: 'MONITORAGGI', icon: '📡', refs: ['u6'] },
        { id: 't8', name: 'REMOTE SENSING', icon: '🛰️', refs: ['u6'] },        
        { id: 't9', name: 'CAROTIERE', icon: '🏗️', refs: ['u3', 'u4'] }
      ];

      // --- PERSISTENZA IDENTITÀ LOCALE (NUOVA SEZIONE) ---
      const IDENTITY_STORAGE_KEY = 'labhub_portal_identity_v1';

      let initialUser = users[0];
      let initialLock = false;

      // Legge lo stato salvato nel browser prima dell'avvio
      const savedIdentity = localStorage.getItem(IDENTITY_STORAGE_KEY);
      if (savedIdentity) {
        try {
          const parsed = JSON.parse(savedIdentity);
          const foundUser = users.find(u => u.id === parsed.userId);
          if (foundUser) initialUser = foundUser;
          if (typeof parsed.isLocked === 'boolean') initialLock = parsed.isLocked;
        } catch (e) {
          console.error("Errore nel ripristino dell'identità salvata", e);
        }
      }

      // --- 2. REACTIVE STATE ---
      const currentUser = ref(initialUser); // Inizializzato con l'utente salvato
      const activeTab = ref('overview');
      const isIdentityDropdownOpen = ref(false);
      const isIdentityLocked = ref(initialLock); // Inizializzato con il lucchetto salvato
      const syncStatus = ref('local'); // 'local' | 'live'
      let isUpdatingFromRemote = false;

      // Data Collections
      const needs = ref([]);
      const deadlines = ref([]);
      const analyses = ref([]);

      // Form Models
      const newDeadline = ref({ title: '', date: '' });
      const newNeed = ref({ type: 'purchase', title: '', details: '' });
      const newAnalysis = ref({ title: '', details: '' });

      // --- 3. STORAGE & REALTIME CLOUD SYNC ---
      const LOCAL_STORAGE_KEY = 'labhub_portal_v3_analyses';

      // Push state changes to Firebase Cloud & LocalStorage
      const pushStateToCloud = async () => {
        const payload = {
          needs: needs.value,
          deadlines: deadlines.value,
          analyses: analyses.value,
          updatedAt: Date.now()
        };

        // Local Storage backup
        localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(payload));

        // Firebase Cloud Sync
        if (window.dbInstance && window.syncDocRef && !isUpdatingFromRemote) {
          try {
            await window.FirebaseInit.setDoc(window.syncDocRef, payload);
          } catch (err) {
            console.error("Errore sincro cloud Firebase:", err);
          }
        }
      };

      const isAuthenticated = ref(false);
      const loginEmail = ref('');
      const loginPassword = ref('');
      const authError = ref('');
      const isLoggingIn = ref(false);

      // Metodo di Login
      const login = async () => {
        authError.value = '';
        isLoggingIn.value = true;
        try {
          const { getAuth, signInWithEmailAndPassword } = window.FirebaseInit;
          const auth = getAuth();
          await signInWithEmailAndPassword(auth, loginEmail.value, loginPassword.value);
          loginPassword.value = '';
        } catch (err) {
          authError.value = "Credenziali errate o utente non trovato.";
        } finally {
          isLoggingIn.value = false;
        }
      };

      // Metodo di Logout
      const logout = async () => {
        const { getAuth, signOut } = window.FirebaseInit;
        await signOut(getAuth());
      };

      // Aggiorna setupRealtimeSync per ascoltare lo stato dell'autenticazione
      const setupRealtimeSync = async () => {
        try {
          if (!window.FirebaseInit) return;

          const firebaseConfig = {
            apiKey: "AIzaSyDywHXjOPKnklecFUK1GtIprQAm8vjs9Cg",
            authDomain: "labhub-portal.firebaseapp.com",
            projectId: "labhub-portal",
            storageBucket: "labhub-portal.firebasestorage.app",
            messagingSenderId: "764223595413",
            appId: "1:764223595413:web:52ce77d768ba553a58cc9c"
          };

          const { initializeApp, getAuth, onAuthStateChanged, getFirestore, doc, onSnapshot } = window.FirebaseInit;
          const app = initializeApp(firebaseConfig);
          const auth = getAuth(app);
          const db = getFirestore(app);

          window.dbInstance = db;
          const docRef = doc(db, 'labhub', 'portal_state');
          window.syncDocRef = docRef;

          // Ascolta se l'utente è loggato o meno
          onAuthStateChanged(auth, (user) => {
            if (user) {
              isAuthenticated.value = true;
              // Avvia l'ascolto in tempo reale solo se l'utente è autenticato
              onSnapshot(docRef, (snapshot) => {
                if (snapshot.exists()) {
                  const data = snapshot.data();
                  isUpdatingFromRemote = true;
                  needs.value = data.needs || [];
                  deadlines.value = data.deadlines || [];
                  analyses.value = data.analyses || [];
                  syncStatus.value = 'live';
                  setTimeout(() => { isUpdatingFromRemote = false; }, 100);
                }
              }, (error) => {
                console.warn("Errore di permessi o di rete:", error);
                syncStatus.value = 'local';
              });
            } else {
              isAuthenticated.value = false;
              syncStatus.value = 'local';
            }
          });

        } catch (error) {
          console.warn("Impossibile avviare la sincronizzazione Firebase:", error);
          syncStatus.value = 'local';
        }
      };

      onMounted(() => {
        // Load local backup state
        const saved = localStorage.getItem(LOCAL_STORAGE_KEY);
        if (saved) {
          try {
            const parsed = JSON.parse(saved);
            needs.value = parsed.needs || [];
            deadlines.value = parsed.deadlines || [];
            analyses.value = parsed.analyses || [];
          } catch (e) {
            console.error("Errore nel caricamento dati locali", e);
          }
        } else {
          // Initial Seed Data
          analyses.value = [
            { id: 'a1', topicId: 't1', title: 'Sequenziamento RNA-seq (NextSeq)', details: 'Run su 24 campioni vegetali', completed: true, createdBy: 'u4' },
            { id: 'a2', topicId: 't1', title: 'Controllo Qualità RIN (Bioanalyzer)', details: 'Soglia accettazione RIN >= 8.0', completed: false, createdBy: 'u4' },
            { id: 'a3', topicId: 't2', title: 'Acquisizione 3D Confocale Zeiss', details: 'Scansione Z-stack su GFP', completed: true, createdBy: 'u5' },
            { id: 'a4', topicId: 't2', title: 'Calibrazione Deconvolution Huygens', details: 'Olio ad immersione e laser 488nm', completed: false, createdBy: 'u5' },
            { id: 'a5', topicId: 't3', title: 'Assembly De Novo Genoma', details: 'Pipeline Flye/Medaka Nanopore', completed: true, createdBy: 'u6' },
            { id: 'a6', topicId: 't3', title: 'Annotazione Funzionale BLAST', details: 'Mappatura famiglie geniche', completed: false, createdBy: 'u6' },
            { id: 'a7', topicId: 't4', title: 'Estrazione Proteica Buffer RIPA', details: 'Dosaggio BCA per 12 lotti', completed: false, createdBy: 'u4' }
          ];

          deadlines.value = [
            { id: 'd1', topicId: 't1', title: 'Invio campioni RNA-seq', date: '2026-10-20', createdBy: 'u4' },
            { id: 'd2', topicId: 't3', title: 'Aggiornamento pipeline bioinformatica', date: '2026-10-25', createdBy: 'u6' },
            { id: 'd3', topicId: 't2', title: 'Taratura laser confocale', date: '2026-10-28', createdBy: 'u5' }
          ];

          needs.value = [
            { id: 'n1', topicId: 't2', type: 'purchase', title: 'Set di pulizia lenti Zeiss', details: 'Fornitore Zeiss, urgente', status: 'pending', createdBy: 'u5' },
            { id: 'n2', topicId: 't1', type: 'admin', title: 'Modulo approvazione comitato etico', details: 'Richiede firma pagina 4', status: 'pending', createdBy: 'u4' },
            { id: 'n3', topicId: 't4', type: 'purchase', title: 'Pipette e puntali stabili', details: 'Scorta trimestrale', status: 'resolved', createdBy: 'u4' }
          ];
        }

        // Initialize cloud sync
        setTimeout(setupRealtimeSync, 300);
      });

      // Watcher to sync changes across all clients when local mutations happen
      watch([needs, deadlines, analyses], () => {
        if (!isUpdatingFromRemote) {
          pushStateToCloud();
        }
      }, { deep: true });

      // --- 4. COMPUTED PROGRESS TRACKERS & DASHBOARD PROPERTIES ---
      const globalAnalysisProgress = computed(() => {
        if (analyses.value.length === 0) return { percent: 100, completed: 0, total: 0 };
        const completed = analyses.value.filter(a => a.completed).length;
        const percent = Math.round((completed / analyses.value.length) * 100);
        return { percent, completed, total: analyses.value.length };
      });

      const getTopicAnalysisProgress = (topicId) => {
        const topicAnalyses = analyses.value.filter(a => a.topicId === topicId);
        if (topicAnalyses.length === 0) return { percent: 100, completed: 0, total: 0 };
        const completed = topicAnalyses.filter(a => a.completed).length;
        const percent = Math.round((completed / topicAnalyses.length) * 100);
        return { percent, completed, total: topicAnalyses.length };
      };

      const getAnalysesByTopic = (topicId) => {
        return analyses.value.filter(a => a.topicId === topicId);
      };

      const pendingNeeds = computed(() => {
        return needs.value.filter(n => n.status === 'pending').reverse();
      });

      const pendingPurchases = computed(() => pendingNeeds.value.filter(n => n.type === 'purchase'));
      const pendingBureaucracy = computed(() => pendingNeeds.value.filter(n => n.type === 'admin'));
      
      const upcomingDeadlines = computed(() => {
        const now = new Date();
        const nextWeek = new Date(now.getTime() + 7 * 24 * 60 * 60 * 1000);
        return deadlines.value.filter(d => {
          const dlDate = new Date(d.date);
          return dlDate >= now && dlDate <= nextWeek;
        });
      });

      // --- 5. HELPER FUNCTIONS & PERMISSIONS ---
      // Salva l'utente attivo e lo stato del lucchetto nel localStorage
      const saveIdentityState = () => {
        localStorage.setItem(IDENTITY_STORAGE_KEY, JSON.stringify({
          userId: currentUser.value.id,
          isLocked: isIdentityLocked.value
        }));
      };

      const selectUser = (user) => {
        if (isIdentityLocked.value) return;
        currentUser.value = user;
        isIdentityDropdownOpen.value = false;
        saveIdentityState(); // <-- Salva la scelta dell'utente
      };

      const toggleIdentityLock = () => {
        isIdentityLocked.value = !isIdentityLocked.value;
        if (isIdentityLocked.value) {
          isIdentityDropdownOpen.value = false;
        }
        saveIdentityState(); // <-- Salva lo stato del lucchetto
      };

      const getUserName = (id) => users.find(u => u.id === id)?.name || 'Sconosciuto';
      const getUserEmoji = (id) => users.find(u => u.id === id)?.emoji || '👤';
      const getTopicName = (id) => topics.find(t => t.id === id)?.name || 'Sconosciuto';
      
      const formatDate = (dateStr) => {
        if (!dateStr) return '';
        const options = { day: '2-digit', month: 'short', year: 'numeric' };
        return new Date(dateStr).toLocaleDateString('it-IT', options);
      };

      const canManageTopic = (topic) => {
        return currentUser.value.role === 'chief' || topic.refs.includes(currentUser.value.id);
      };

      const getDeadlinesByTopic = (topicId) => {
        return deadlines.value.filter(d => d.topicId === topicId).sort((a, b) => new Date(a.date) - new Date(b.date));
      };

      const getNeedsByTopic = (topicId) => {
        return [...needs.value]
          .filter(n => n.topicId === topicId)
          .sort((a, b) => (a.status === b.status ? 0 : a.status === 'pending' ? -1 : 1));
      };

      // --- 6. USER ACTIONS ---
      const addAnalysis = (topicId) => {
        if (!isIdentityLocked.value) return;
        if (!newAnalysis.value.title) return;

        analyses.value.push({
          id: 'an_' + Date.now(),
          topicId: topicId,
          title: newAnalysis.value.title,
          details: newAnalysis.value.details,
          completed: false,
          createdBy: currentUser.value.id
        });

        newAnalysis.value.title = '';
        newAnalysis.value.details = '';
      };

      const toggleAnalysis = (id) => {
        if (!isIdentityLocked.value) return;
        const item = analyses.value.find(a => a.id === id);
        if (item) {
          item.completed = !item.completed;
        }
      };

      const deleteAnalysis = (id) => {
        if (!isIdentityLocked.value) return;
        analyses.value = analyses.value.filter(a => a.id !== id);
      };

      const addDeadline = (topicId) => {
        if (!isIdentityLocked.value) return;
        if (!newDeadline.value.title || !newDeadline.value.date) return;
        
        deadlines.value.push({
          id: 'dl_' + Date.now(),
          topicId: topicId,
          title: newDeadline.value.title,
          date: newDeadline.value.date,
          createdBy: currentUser.value.id
        });
        
        newDeadline.value.title = '';
        newDeadline.value.date = '';
      };

      const deleteDeadline = (id) => {
        if (!isIdentityLocked.value) return;
        deadlines.value = deadlines.value.filter(d => d.id !== id);
      };

      const addNeed = (topicId) => {
        if (!isIdentityLocked.value) return;
        if (!newNeed.value.title) return;

        needs.value.push({
          id: 'nd_' + Date.now(),
          topicId: topicId,
          type: newNeed.value.type,
          title: newNeed.value.title,
          details: newNeed.value.details,
          status: 'pending',
          createdBy: currentUser.value.id
        });

        newNeed.value.title = '';
        newNeed.value.details = '';
      };

      const resolveNeed = (id) => {
        if (!isIdentityLocked.value) return;
        if (currentUser.value.role !== 'chief') return;

        const need = needs.value.find(n => n.id === id);
        if (need) {
          need.status = 'resolved';
        }
      };

      const deleteNeed = (id) => {
        if (!isIdentityLocked.value) return;
        needs.value = needs.value.filter(n => n.id !== id);
      };
 
      return {
        users, topics, currentUser, activeTab, isIdentityDropdownOpen, isIdentityLocked, syncStatus,
        selectUser, toggleIdentityLock, canManageTopic, getUserName, getUserEmoji, getTopicName, formatDate,
        needs, deadlines, analyses, newDeadline, newNeed, newAnalysis,
        globalAnalysisProgress, getTopicAnalysisProgress, getAnalysesByTopic,
        pendingNeeds, pendingPurchases, pendingBureaucracy, upcomingDeadlines,
        getDeadlinesByTopic, getNeedsByTopic,
        addAnalysis, toggleAnalysis, deleteAnalysis,
        addDeadline, deleteDeadline, addNeed, resolveNeed, deleteNeed, 
        isAuthenticated, loginEmail, loginPassword, authError, isLoggingIn, login, logout
      };
    }
  }).mount('#app');
</script>
